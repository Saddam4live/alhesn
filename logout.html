<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <title>الحصن - تم تسجيل الخروج</title>
  <link rel="stylesheet" href="fonts/cairo.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container desktop-center-card">
    <div class="content-sheet no-hero">
      
      <!-- Top Pill -->
      <div style="text-align: center; margin-bottom: 20px;">
        <div class="top-status-pill">
          <span class="live-clock-text" data-status="DISCONNECTED">2:45 PM • APR 19 • DISCONNECTED</span>
          <svg viewBox="0 0 24 24" stroke="#ef4444">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
          </svg>
        </div>
      </div>

      <!-- Brand Logo -->
      <div class="brand-header" style="margin-bottom: 16px;">
        <img src="img/logo-horizontal.png" alt="الحصن" class="logo-img">
        <div class="welcome-desc">نأمل أن تكون تجربتك ممتعة.</div>
      </div>

      <!-- Coffee Cup Circle Badge -->
      <div class="cup-circle-icon">
        <svg viewBox="0 0 24 24">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
          <line x1="6" y1="1" x2="6" y2="4"></line>
          <line x1="10" y1="1" x2="10" y2="4"></line>
          <line x1="14" y1="1" x2="14" y2="4"></line>
        </svg>
      </div>

      <!-- Notice Headings -->
      <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">إلى اللقاء!</h2>
        <p style="font-size: 0.92rem; color: var(--text-secondary); line-height: 1.6; max-width: 320px; margin: 0 auto;">
          تم تسجيل خروجك بنجاح من الشبكة. يسعدنا استقبالك في أي وقت.
        </p>
      </div>

      <!-- Session Summary Card -->
      <div class="summary-card">
        <div class="summary-card-title">
          <span>ملخص الجلسة</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="summary-row">
          <span>مدة الجلسة</span>
          <span class="val">$(uptime)</span>
        </div>
        <div class="summary-row">
          <span>إجمالي التحميل</span>
          <span class="val">$(bytes-out-nice)</span>
        </div>
      </div>

      <!-- Star Rating Card -->
      <div class="rating-banner-card">
        <div class="rating-stars">★★★★★</div>
        <div class="rating-title">شكراً لزيارتك</div>
        <div class="rating-subtitle">نقدّر ثقتك بنا ونتطلع إلى رؤيتك مجدداً.</div>
      </div>

      <!-- Return Button -->
      <a href="$(link-login)" class="btn-primary" style="margin-top: 10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        <span>تسجيل الدخول مجدداً</span>
      </a>

      <!-- Developer / Network Branding Logos -->
      <div class="footer-brand-logos" style="margin-top: 24px;">
        <img src="img/logo2.png" alt="Connect" class="brand-logo-connect">
        <img src="img/logo.png" alt="كمبيوتر فريندس" class="brand-logo-banner">
      </div>

    </div>
  </div>

  <script src="config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
