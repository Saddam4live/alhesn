<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="refresh" content="3; url=$(link-redirect)">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <title>الحصن - تم الاتصال بنجاح</title>
  <link rel="stylesheet" href="fonts/cairo.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container desktop-center-card">
    <div class="content-sheet no-hero">
      
      <!-- Top Pill -->
      <div style="text-align: center; margin-bottom: 24px;">
        <div class="top-status-pill">
          <span class="live-clock-text" data-status="CONNECTED">2:44 PM • APR 19 • CONNECTED</span>
          <svg viewBox="0 0 24 24">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
          </svg>
        </div>
      </div>

      <!-- Brand Logo -->
      <div class="brand-header">
        <img src="img/logo-horizontal.png" alt="الحصن" class="logo-img">
        <div class="welcome-desc">مرحباً بك! تم الاتصال بنجاح.</div>
      </div>

      <!-- Golden Circle Checkmark Badge -->
      <div class="success-circle-icon">
        <svg viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <!-- Heading & Notice -->
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px;">تم الاتصال بالشبكة</h2>
        <p style="font-size: 0.92rem; color: var(--text-secondary); line-height: 1.6; max-width: 340px; margin: 0 auto;">
          أهلاً بك في شبكة الحصن اللاسلكية. سيتم توجيهك تلقائياً خلال لحظات.
        </p>
      </div>

      <!-- Countdown Card -->
      <div class="timer-box">
        <div class="timer-number" id="countdownNumber">3</div>
        <div class="timer-label">
          <span>الانتقال للإنترنت خلال</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </div>
      </div>
      <div class="timer-progress" style="margin-top: -12px; margin-bottom: 24px;">
        <div class="timer-progress-bar" id="countdownProgress"></div>
      </div>

      <!-- Action Button -->
      <a href="$(link-redirect)" class="btn-primary" id="redirectNowBtn">
        <span>الانتقال الآن إلى الإنترنت</span>
        <span>←</span>
      </a>

      <!-- Developer / Network Branding Logos -->
      <div class="footer-brand-logos" style="margin-top: 24px;">
        <img src="img/logo2.png" alt="Connect" class="brand-logo-connect">
        <img src="img/logo.png" alt="كمبيوتر فريندس" class="brand-logo-banner">
      </div>

    </div>
  </div>

  <script src="config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
